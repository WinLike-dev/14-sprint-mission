spring:
  application:
    name: discodeit

  # compose.yml과 같은 .env를 읽어 DB 접속 정보를 한 곳에서 관리한다.
  # 경로는 실행 디렉터리 기준이므로 프로젝트 루트에서 실행해야 한다.
  # 파일이 없으면 무시하고 OS 환경 변수로 값을 받는다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  # schema.sql로 스키마를 만든다. PostgreSQL 같은 외부 DB에서는 기본값(embedded)이면 실행되지 않는다.
  # 스크립트가 create table if not exists라 여러 번 떠도 안전하고, JPA 검증보다 먼저 실행된다.
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      # 스키마는 직접 관리하고 Hibernate는 엔티티와 테이블이 맞는지만 확인한다.
      # 개발 중 자동 생성이 필요하면 JPA_DDL_AUTO=update 등으로 덮어쓴다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    # 뷰 렌더링까지 영속성 컨텍스트를 열어두지 않는다. 지연 로딩은 트랜잭션 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # INSERT/UPDATE를 묶어 한 번에 보낸다. id를 애플리케이션이 만들기 때문에(GenerationType.UUID) 배치가 동작한다.
        order_inserts: true
        order_updates: true
        # 지연 로딩할 연관관계를 건별로 묻지 않고 in (...)으로 묶어 조회한다.
        # 메시지 첨부처럼 페이지네이션과 함께 쓰는 컬렉션은 fetch join 대신 이 방식으로 N+1을 줄인다.
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          # 도메인이 Instant를 쓰므로 JVM 기본 시간대와 무관하게 UTC로 저장한다.
          time_zone: UTC

  # 프로필 이미지와 메시지 첨부파일을 multipart로 받는다.
  # 기본값(파일 1MB, 요청 10MB)은 이미지 한 장에도 걸리기 쉬워 올려둔다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

springdoc:
  # OpenAPI 문서(JSON) 경로. oasdiff로 제공 스펙과 비교할 때 이 경로를 사용한다.
  api-docs:
    path: /v3/api-docs
  # Swagger UI 경로. 브라우저에서 API를 직접 호출해볼 수 있다.
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    # 실행되는 SQL을 로그로 확인한다. 바인딩 값까지 보려면 org.hibernate.orm.jdbc.bind: trace
    org.hibernate.SQL: debug

discodeit:
  storage:
    # 바이너리 파일 저장 방식. 지금은 local만 지원하고, 다른 값이면 기동 단계에서 실패한다.
    type: ${DISCODEIT_STORAGE_TYPE:local}
    local:
      # 파일을 저장할 루트 경로. 상대 경로는 실행 디렉터리 기준이다.
      root-path: ${DISCODEIT_STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}